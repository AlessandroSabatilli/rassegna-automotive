name: Rassegna Automotive
on:
  schedule:
    - cron: "0 5 * * *"   # 05:00 UTC: ~07:00 in Italia (estate), ~06:00 (inverno)
  workflow_dispatch:        # avvio manuale
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install feedparser anthropic google-api-python-client google-auth
      - run: python rassegna_automotive_v0.4.py
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          RECIPIENT: ${{ secrets.RECIPIENT }}
          GDOC_ID: ${{ secrets.GDOC_ID }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
